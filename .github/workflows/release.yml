name: Release

on:
  push:
    tags: ["v*"]

# Runs the security gate and the full check on the tagged commit, then creates the GitHub release.
# Publishing to npm is done by hand from the tag once this passes; see CONTRIBUTING.md.
permissions: {}

jobs:
  security:
    name: Security gate
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  check:
    name: Check the tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Verify the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v$version" >&2
            exit 1
          fi

  release:
    name: Create the GitHub release
    needs: [security, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it untouched."
            exit 0
          fi
          notes=$(awk -v tag="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" tag "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "${notes:-See CHANGELOG.md}"
