name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: jev-code version
      description: Output of `jev-code version`.
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options: [Claude Code, Codex, Pi, OpenCode, CLI only, Other]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `jev-code doctor`
      description: Paste it verbatim; the key is masked automatically.
      render: text
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The tool payload (with any private text replaced) and the exact command or prompt.
      render: json
