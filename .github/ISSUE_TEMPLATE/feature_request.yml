name: Feature request
description: A tool, recipe, harness, or setup improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The coding-agent moment where Jev would help, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and what would the payload or command look like?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
